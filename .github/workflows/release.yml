name: Rilis (APK + Pages)

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', '.gitignore']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Periksa sintaks JavaScript
        run: node --check app.js && node --check sw.js
      - run: npm install
      - run: node prepare-www.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Periksa sintaks JavaScript
        run: node --check app.js && node --check sw.js
      - run: npm install
      - run: node prepare-www.js
      - run: npx cap add android
      - run: node prepare-android.js
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FlashcardArab-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlashcardArab-APK
          path: FlashcardArab-v1.0.${{ github.run_number }}.apk
      - name: Buat Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Flashcard Arab v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: FlashcardArab-v1.0.${{ github.run_number }}.apk
